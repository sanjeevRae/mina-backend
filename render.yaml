# Render deployment configuration - MEMORY OPTIMIZED FOR FREE TIER
services:
  - type: web
    name: telemedicine-backend
    env: python
    runtime: python-3.11.4
    buildCommand: pip install --upgrade pip && pip install --no-cache-dir -r requirements.txt
    startCommand: python start_server.py
    # Model will auto-train on first API request (1-2 min)
    # Removed retrain_model.py from startup to save memory on free tier
    # Models will be trained on-demand when first requested
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: "false"
      # Base URL for keep-alive mechanism (set this to your Render service URL)
      - key: BASE_URL
        value: "${BASE_URL}"
      # Supabase PostgreSQL - Free tier database for persistent data storage
      # Get your Supabase database URL from https://supabase.com
      # Format: postgresql://postgres.xxx:password@aws-0-us-east-1.pooler.supabase.com:5432/postgres
      # See SUPABASE_SETUP.md for detailed instructions
      - key: SUPABASE_DB_URL
        value: "${SUPABASE_DB_URL}"
      # Alternative: Use DATABASE_URL (both work)
      - key: DATABASE_URL
        value: "${DATABASE_URL}"
      - key: REDIS_URL
        value: "redis://red-d58fpluuk2gs73djegfg:PY5FJC6eNkCY6Vjiuj7dJ9jgUd4DjbyN@singapore-keyvalue.render.com:6379"
      - key: ENABLE_VIDEO_CALLS
        value: "true"
      - key: ENABLE_PUSH_NOTIFICATIONS
        value: "false"
      - key: ENABLE_EMAIL_NOTIFICATIONS
        value: "true"
    # Memory optimization settings
    plan: free
    autoDeploy: false  # Manual deploys to control memory usage

# NO PostgreSQL DATABASE - Using SQLite for free tier
# NO separate Redis service - Using external Redis URL
