# Render deployment configuration - MEMORY OPTIMIZED FOR FREE TIER
services:
  - type: web
    name: telemedicine-backend
    env: python
    runtime: python-3.11.4
    buildCommand: pip install --upgrade pip && pip install -r requirements.txt
    startCommand: python start_server.py
    # Removed retrain_model.py from startup to save memory on free tier
    # Models will be trained on-demand when first requested
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: "false"
      # Railway PostgreSQL - Free tier database for data persistence
      # Get your Railway database URL from https://railway.app
      # Format: postgresql://postgres:password@containers-us-west-1.railway.app:5432/railway
      - key: DATABASE_URL
        value: "${DATABASE_URL}"
      - key: REDIS_URL
        value: "redis://red-d58fpluuk2gs73djegfg:PY5FJC6eNkCY6Vjiuj7dJ9jgUd4DjbyN@singapore-keyvalue.render.com:6379"
      - key: ENABLE_VIDEO_CALLS
        value: "true"
      - key: ENABLE_PUSH_NOTIFICATIONS
        value: "false"
      - key: ENABLE_EMAIL_NOTIFICATIONS
        value: "true"
    # Memory optimization settings
    plan: free
    autoDeploy: false  # Manual deploys to control memory usage

# NO PostgreSQL DATABASE - Using SQLite for free tier
# NO separate Redis service - Using external Redis URL
