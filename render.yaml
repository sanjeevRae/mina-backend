# Render deployment configuration
services:
  - type: web
    name: telemedicine-backend
    env: python
    runtime: python-3.11.4
    buildCommand: pip install --upgrade pip && pip install -r requirements.txt && pip install -e .
    startCommand: PYTHONPATH=/opt/render/project/src uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: "false"

databases:
  - name: telemedicine-db
    databaseName: telemedicine
    user: telemedicine_user

services:
  - type: redis
    name: telemedicine-redis
    ipAllowList: [] # only allow internal connections